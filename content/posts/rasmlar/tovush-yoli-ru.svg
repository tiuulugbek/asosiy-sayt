<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1098" width="800" height="1098" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="1098" fill="#FFFFFF"/>
<text x="400" y="64" font-size="40" fill="#3F3091" text-anchor="middle" font-weight="700"><tspan x="400" dy="0">Как звук попадает в мозг</tspan></text><rect x="40" y="152" width="720" height="140" rx="18" fill="#FFFFFF" stroke="#3F3091" stroke-width="4"/><circle cx="100" cy="222.0" r="26" fill="#3F3091"/><text x="100" y="233.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">1</tspan></text><text x="152" y="210.0" font-size="34" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Наружное ухо</tspan></text><text x="152" y="258.0" font-size="30" fill="#6B7280" text-anchor="start"><tspan x="152" dy="0">собирает звук</tspan></text><path d="M400 300 V334" stroke="#3F3091" stroke-width="5" stroke-linecap="round"/><path d="M388 324 L400 338 L412 324" fill="none" stroke="#3F3091" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="346" width="720" height="140" rx="18" fill="#FFFFFF" stroke="#3F3091" stroke-width="4"/><circle cx="100" cy="416.0" r="26" fill="#3F3091"/><text x="100" y="427.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">2</tspan></text><text x="152" y="404.0" font-size="34" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Барабанная перепонка</tspan></text><text x="152" y="452.0" font-size="30" fill="#6B7280" text-anchor="start"><tspan x="152" dy="0">колеблется</tspan></text><path d="M400 494 V528" stroke="#3F3091" stroke-width="5" stroke-linecap="round"/><path d="M388 518 L400 532 L412 518" fill="none" stroke="#3F3091" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="540" width="720" height="140" rx="18" fill="#FFFFFF" stroke="#3F3091" stroke-width="4"/><circle cx="100" cy="610.0" r="26" fill="#3F3091"/><text x="100" y="621.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">3</tspan></text><text x="152" y="598.0" font-size="34" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Слуховые косточки</tspan></text><text x="152" y="646.0" font-size="30" fill="#6B7280" text-anchor="start"><tspan x="152" dy="0">усиливают колебания</tspan></text><path d="M400 688 V722" stroke="#3F3091" stroke-width="5" stroke-linecap="round"/><path d="M388 712 L400 726 L412 712" fill="none" stroke="#3F3091" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="734" width="720" height="140" rx="18" fill="#FFFFFF" stroke="#3F3091" stroke-width="4"/><circle cx="100" cy="804.0" r="26" fill="#3F3091"/><text x="100" y="815.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">4</tspan></text><text x="152" y="792.0" font-size="34" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Улитка</tspan></text><text x="152" y="840.0" font-size="30" fill="#6B7280" text-anchor="start"><tspan x="152" dy="0">превращает в нервный сигнал</tspan></text><path d="M400 882 V916" stroke="#3F3091" stroke-width="5" stroke-linecap="round"/><path d="M388 906 L400 920 L412 906" fill="none" stroke="#3F3091" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="928" width="720" height="140" rx="18" fill="#FFFFFF" stroke="#F07E22" stroke-width="4"/><circle cx="100" cy="998.0" r="26" fill="#F07E22"/><text x="100" y="1009.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">5</tspan></text><text x="152" y="986.0" font-size="34" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Мозг</tspan></text><text x="152" y="1034.0" font-size="30" fill="#6B7280" text-anchor="start"><tspan x="152" dy="0">понимает звук</tspan></text>
</svg>
