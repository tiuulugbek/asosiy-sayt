<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 924" width="800" height="924" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="924" fill="#FFFFFF"/>
<text x="400" y="64" font-size="40" fill="#3F3091" text-anchor="middle" font-weight="700"><tspan x="400" dy="0">Как ребёнок реагирует на звук</tspan></text><rect x="40" y="148" width="720" height="136" rx="16" fill="#F6F5FB"/><rect x="40" y="420" width="720" height="96" rx="16" fill="#F6F5FB"/><rect x="40" y="612" width="720" height="96" rx="16" fill="#F6F5FB"/><line x1="80" x2="80" y1="216.0" y2="776.0" stroke="#3F3091" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="216.0" r="15" fill="#F07E22" stroke="#FFFFFF" stroke-width="5"/><text x="116" y="227.0" font-size="32" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="116" dy="0">0–3 месяца</tspan></text><text x="370" y="206.0" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="370" dy="0">Вздрагивает от</tspan><tspan x="370" dy="40">громкого звука</tspan></text><circle cx="80" cy="352.0" r="15" fill="#F07E22" stroke="#FFFFFF" stroke-width="5"/><text x="116" y="363.0" font-size="32" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="116" dy="0">3–6 месяцев</tspan></text><text x="370" y="342.0" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="370" dy="0">Поворачивается</tspan><tspan x="370" dy="40">к звуку</tspan></text><circle cx="80" cy="468.0" r="15" fill="#F07E22" stroke="#FFFFFF" stroke-width="5"/><text x="116" y="479.0" font-size="32" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="116" dy="0">7–12 месяцев</tspan></text><text x="370" y="478.0" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="370" dy="0">Знает своё имя</tspan></text><circle cx="80" cy="564.0" r="15" fill="#F07E22" stroke="#FFFFFF" stroke-width="5"/><text x="116" y="575.0" font-size="32" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="116" dy="0">12–18 месяцев</tspan></text><text x="370" y="574.0" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="370" dy="0">Первые слова</tspan></text><circle cx="80" cy="660.0" r="15" fill="#F07E22" stroke="#FFFFFF" stroke-width="5"/><text x="116" y="671.0" font-size="32" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="116" dy="0">2 года</tspan></text><text x="370" y="670.0" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="370" dy="0">Соединяет слова</tspan></text><circle cx="80" cy="776.0" r="15" fill="#F07E22" stroke="#FFFFFF" stroke-width="5"/><text x="116" y="787.0" font-size="32" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="116" dy="0">3–4 года</tspan></text><text x="370" y="766.0" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="370" dy="0">Строит фразы,</tspan><tspan x="370" dy="40">задаёт вопросы</tspan></text><text x="400" y="894" font-size="28" fill="#6B7280" text-anchor="middle"><tspan x="400" dy="0">Возрастные границы приблизительны</tspan></text>
</svg>
