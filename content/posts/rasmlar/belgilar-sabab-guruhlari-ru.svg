<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 928" width="800" height="928" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="928" fill="#FFFFFF"/>
<text x="400" y="64" font-size="40" fill="#3F3091" text-anchor="middle" font-weight="700"><tspan x="400" dy="0">Почему снижается слух</tspan></text><rect x="40" y="104" width="720" height="380" rx="20" fill="#FFFFFF" stroke="#3F3091" stroke-width="4"/><text x="72" y="168" font-size="34" fill="#3F3091" text-anchor="start" font-weight="700"><tspan x="72" dy="0">Звук не доходит до</tspan><tspan x="72" dy="44">внутреннего уха</tspan></text><circle cx="84" cy="259" r="7" fill="#3F3091"/><text x="104" y="270" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="104" dy="0">Серная пробка</tspan></text><circle cx="84" cy="305" r="7" fill="#3F3091"/><text x="104" y="316" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="104" dy="0">Воспаление среднего уха</tspan></text><circle cx="84" cy="351" r="7" fill="#3F3091"/><text x="104" y="362" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="104" dy="0">Повреждение барабанной перепонки</tspan></text><rect x="72" y="384" width="490" height="62" rx="26" fill="#ECE9F7"/><text x="96" y="425" font-size="30" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="96" dy="0">Часто поддаётся лечению</tspan></text><rect x="40" y="508" width="720" height="380" rx="20" fill="#FFFFFF" stroke="#F07E22" stroke-width="4"/><text x="72" y="572" font-size="34" fill="#F07E22" text-anchor="start" font-weight="700"><tspan x="72" dy="0">Повреждены внутреннее</tspan><tspan x="72" dy="44">ухо или слуховой нерв</tspan></text><circle cx="84" cy="663" r="7" fill="#F07E22"/><text x="104" y="674" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="104" dy="0">Возрастные изменения</tspan></text><circle cx="84" cy="709" r="7" fill="#F07E22"/><text x="104" y="720" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="104" dy="0">Многолетний шум</tspan></text><circle cx="84" cy="755" r="7" fill="#F07E22"/><text x="104" y="766" font-size="32" fill="#1F2937" text-anchor="start"><tspan x="104" dy="0">Наследственность</tspan></text><rect x="72" y="788" width="520" height="62" rx="26" fill="#FDEBDC"/><text x="96" y="829" font-size="30" fill="#1F2937" text-anchor="start" font-weight="700"><tspan x="96" dy="0">Помогает слуховой аппарат</tspan></text>
</svg>
